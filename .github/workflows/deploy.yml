# Сборка и публикация на GitHub Pages при каждом пуше в main. Сайт не обновится, если упали тесты
# логики или автотесты экранов на собранном сайте.
name: Публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Сборка
        run: npm run build
      - name: Браузер для автотестов
        run: npx playwright install --with-deps --only-shell chromium
      # Что упало, видно в логе шага.
      - name: Автотесты экранов
        run: npm run e2e
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
